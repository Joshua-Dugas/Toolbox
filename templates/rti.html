<style>
/* Base layout */
#game-container {
  display: flex;
  flex-direction: row;
  align-items: flex-start;
  gap: 20px;
}

/* Left column holds ascii + text stacked */
#left-panel {
  display: flex;
  flex-direction: column;
  flex: 2;
  gap: 10px;
}

/* Right column holds buttons */
#button-container {
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex: 1;
}

/* ASCII + text areas */
#ascii-container,
#text-container {
  white-space: pre;
  overflow-x: auto;
}

/* console look */
pre {
  font-family: monospace;
  padding: 10px;
  border: 1px solid #444;
  background: #111;
  color: #ddd;
  border-radius: 6px;
}

/* buttons styled like console blocks */
#button-container button {
  font-family: monospace;
  background: #111;
  color: #ddd;
  border: 1px solid #444;
  padding: 8px 10px;
  border-radius: 6px;
  cursor: pointer;
  text-align: left;
}

/* hover effect */
#button-container button:hover {
  background: #222;
  border-color: #666;
}

/* active click effect */
#button-container button:active {
  background: #333;
}

/* Mobile layout */
@media (max-width: 600px) {
  #game-container {
    flex-direction: column;
  }

  #button-container {
    width: 100%;
  }
}
</style>

<h3>Roads To Izalyth</h3>

<div id="game-container">

  <div id="left-panel">
    <pre id="ascii-container"></pre>  
    <pre id="text-container"></pre>
  </div>

  <div>
    <p>Available Actions:</p>
    <div id="button-container"></div>
  </div>

</div>

<script>
  initializeGame()
</script>
<script src="/static/js/rtiController.js"></script>
